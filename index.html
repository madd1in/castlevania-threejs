<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CASTLEVANIA — Shadow of the Crimson Moon</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#e8e2d0;
    font-family:"Consolas","DejaVu Sans Mono",monospace}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* ---------- post overlays ---------- */
  /* one composited layer instead of three: mix-blend-mode forces the
     compositor to re-blend the whole canvas every frame, so the grade is
     baked into the vignette gradient and the scanlines ride along with it */
  #vignette{position:absolute;inset:0;pointer-events:none;z-index:11;
    background:
      repeating-linear-gradient(180deg,rgba(0,0,0,.20) 0 1px,rgba(0,0,0,0) 1px 3px),
      linear-gradient(180deg,rgba(70,30,95,.20),rgba(0,0,0,0) 45%,rgba(150,40,25,.14)),
      radial-gradient(ellipse 78% 72% at 50% 48%,rgba(0,0,0,0) 40%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.82) 100%)}
  #dmg{position:absolute;inset:0;pointer-events:none;z-index:11;opacity:0;
    background:radial-gradient(ellipse 70% 62% at 50% 50%,rgba(0,0,0,0) 42%,rgba(150,10,14,.55) 82%,rgba(190,20,20,.9) 100%)}

  /* ---------- HUD ---------- */
  #hud{position:absolute;left:0;right:0;top:0;padding:10px 14px;pointer-events:none;z-index:13;
    background:linear-gradient(180deg,rgba(4,4,12,.92) 0%,rgba(4,4,12,.72) 62%,rgba(4,4,12,0) 100%);
    font-size:13px;letter-spacing:1.5px;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .4s}
  #hud.show{opacity:1}
  .hrow{display:flex;gap:22px;align-items:flex-start;max-width:1100px;margin:0 auto}
  .hcol{display:flex;flex-direction:column;gap:5px}
  .hcol.grow{flex:1}
  .lbl{color:#c8a24a;font-size:11px;letter-spacing:2.5px}
  .bar{display:flex;gap:2px;height:12px;padding:2px;background:#120c10;border:1px solid #4a3a22}
  .seg{width:9px;height:100%;background:#2a1418}
  .seg.on{background:linear-gradient(180deg,#ffd35c,#e0392b);box-shadow:0 0 5px rgba(255,140,60,.6)}
  .bar.boss{border-color:#6a2222;display:inline-flex}
  .bar.boss .seg{background:#210c10}
  .bar.boss .seg.on{background:linear-gradient(180deg,#ff7b7b,#7a0d16);box-shadow:0 0 5px rgba(255,40,40,.55)}
  .stat{white-space:nowrap;font-size:13px;color:#efe8d4}
  .stat b{color:#fff;font-weight:600}
  .stat i{color:#c8a24a;font-style:normal;font-size:11px;letter-spacing:2.5px;margin-right:6px}
  .right{text-align:right;align-items:flex-end}
  #combo{color:#ffb347;font-size:12px;letter-spacing:3px;min-height:14px}
  #stopwatch{color:#8fd8ff;font-size:12px;letter-spacing:3px;min-height:14px}
  #bossrow{max-width:1100px;margin:8px auto 0;display:none}
  #bossrow.show{display:block}
  #subicon{color:#9ecbff}
  #fpsrow{opacity:.55;font-size:11px}
  #fps.low{color:#e0554a}

  /* ---------- floating text ---------- */
  #toast{position:absolute;left:50%;top:19%;transform:translateX(-50%);z-index:14;white-space:nowrap;
    font-family:Georgia,serif;letter-spacing:6px;font-size:26px;color:#e9d9a8;
    text-shadow:0 3px 0 #000,0 0 20px rgba(230,180,70,.6);opacity:0;pointer-events:none;transition:opacity .3s}
  #card{position:absolute;left:50%;top:38%;transform:translateX(-50%);z-index:14;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .5s;white-space:nowrap}
  #card .cnum{display:block;font-size:13px;letter-spacing:9px;color:#c8a24a;margin-bottom:8px}
  #card .cname{display:block;font-family:Georgia,serif;font-size:clamp(26px,5vw,52px);letter-spacing:10px;
    color:#f0e4c4;text-shadow:0 4px 0 #000,0 0 34px rgba(230,180,70,.45)}

  /* ---------- Screens ---------- */
  .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,rgba(30,10,14,.55),rgba(0,0,0,.93) 70%);
    text-align:center;z-index:20;transition:opacity .35s}
  .screen.hide{opacity:0;pointer-events:none}
  .frame{padding:34px 46px;max-width:820px}
  h1{font-family:"Trajan Pro","Palatino Linotype","Book Antiqua",Georgia,serif;
    font-size:clamp(30px,6.6vw,80px);letter-spacing:9px;padding-right:9px;font-weight:700;line-height:1.05;
    background:linear-gradient(180deg,#fff5d0 0%,#e3b955 42%,#8d2f22 78%,#5a1410 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 #1a0508) drop-shadow(0 0 26px rgba(190,50,40,.45))}
  h2{font-family:Georgia,serif;font-style:italic;font-weight:400;color:#b09a78;
    font-size:clamp(13px,2vw,20px);letter-spacing:5px;margin-top:6px}
  .rule{height:1px;margin:22px auto;width:70%;
    background:linear-gradient(90deg,transparent,#8d6b31,transparent)}
  .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 24px;
    font-size:12px;color:#9a917f;letter-spacing:1px;margin:0 auto;max-width:700px;text-align:left}
  .keys b{color:#e5d3a2;font-weight:600}
  .press{margin-top:26px;font-size:15px;letter-spacing:4px;color:#e9dcb4;animation:blink 1.15s steps(1) infinite}
  .press b{color:#ff6a4d}
  @keyframes blink{50%{opacity:.15}}
  .note{margin-top:16px;font-size:10px;color:#5d564a;letter-spacing:2px}
  .diffpick{font-family:Georgia,serif;font-size:clamp(18px,3vw,30px);letter-spacing:7px;color:#6d6553}
  .diffsub{font-family:"Consolas",monospace;font-size:11px;letter-spacing:2px;color:#9a917f;
    margin-top:8px;line-height:1.9}
  .big{font-size:clamp(30px,6vw,64px);letter-spacing:8px;font-family:Georgia,serif;color:#c0392b;
    text-shadow:0 3px 0 #1a0508,0 0 30px rgba(200,40,30,.5)}
  .win{color:#e3b955;text-shadow:0 3px 0 #2a1a05,0 0 34px rgba(230,180,70,.5)}
  .sub{margin-top:14px;color:#a99b7e;font-size:14px;letter-spacing:2px;line-height:1.8}
  .sub b{color:#e5d3a2}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="dmg"></div>
  <div id="vignette"></div>

  <div id="hud">
    <div class="hrow">
      <div class="hcol">
        <div class="lbl">SIMON</div>
        <div class="bar" id="pbar"></div>
        <div class="stat"><i>WHIP</i><b id="whiplvl">LEATHER</b></div>
      </div>
      <div class="hcol grow">
        <div class="stat"><i>SCORE</i><b id="score">000000</b></div>
        <div class="stat"><i>STAGE</i><b id="stage">I &middot; COURTYARD</b></div>
        <div id="combo"></div>
        <div id="stopwatch"></div>
      </div>
      <div class="hcol right">
        <div class="stat"><i>HEARTS</i><b id="hearts">08</b></div>
        <div class="stat"><i>SUB</i><b id="subicon">—</b></div>
        <div class="stat"><i>LIVES</i><b id="lives">04</b></div>
        <div class="stat" id="diffrow"><i>MODE</i><b id="diffname">HUNTER</b></div>
        <div class="stat" id="fpsrow"><i>FPS</i><b id="fps">60</b></div>
      </div>
    </div>
    <div id="bossrow">
      <div class="lbl" style="color:#d05a4a" id="bossname">COUNT DRACULA</div>
      <div class="bar boss" id="bbar"></div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="card"></div>
  <div id="flash"></div>

  <div class="screen" id="screen"><div class="frame" id="frame"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/core.js?v=4"></script>
<script src="js/world.js?v=4"></script>
<script src="js/entities.js?v=4"></script>
<script src="js/game.js?v=4"></script>
</body>
</html>
